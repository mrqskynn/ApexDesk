<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#03055d" />
      <stop offset="100%" stop-color="#2562e9" />
    </linearGradient>
    <mask id="chip-cutout">
      <rect width="150" height="150" fill="#ffffff" />
      <path d="M61.5 55 V76 L71 86 H91.5" fill="none" stroke="#000000" stroke-width="4.6" stroke-linecap="butt" stroke-linejoin="miter" />
      <circle cx="62.5" cy="84.5" r="3.6" fill="#000000" />
      <path d="M75.5 55 V71.5 H91.5" fill="none" stroke="#000000" stroke-width="4.8" stroke-linecap="butt" stroke-linejoin="miter" />
    </mask>
  </defs>

  <rect width="150" height="150" rx="10" fill="url(#bg)" />

  <!-- Central microchip -->
  <rect x="54" y="51" width="42" height="42" fill="#f8fafc" mask="url(#chip-cutout)" />

  <!-- Circuit traces -->
  <g fill="none" stroke="#f8fafc" stroke-width="4.2" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- Top -->
    <path d="M60 45 V23.5 H44" />
    <path d="M70 45 V16" />
    <path d="M80 45 V32" />
    <path d="M90 45 V29" />
    <!-- Right -->
    <path d="M101 56.5 H127 V46" />
    <path d="M101 66.5 H114" />
    <path d="M101 77.5 H121" />
    <path d="M101 86.5 H114.5 V114" />
    <!-- Bottom -->
    <path d="M90 98 V133" />
    <path d="M80 98 V111" />
    <path d="M70 98 V121" />
    <path d="M60 98 V111" />
    <!-- Left -->
    <path d="M48 86.5 H42 V107" />
    <path d="M48 76.5 H36" />
    <path d="M48 66.5 H24 V89" />
    <path d="M48 56.5 H35.5 V42 H16" />
  </g>

  <!-- Circuit endpoint nodes -->
  <g fill="#f8fafc">
    <circle cx="39" cy="23.5" r="7.2" />
    <circle cx="90" cy="23.5" r="7.2" />
    <circle cx="127" cy="40.5" r="7.2" />
    <circle cx="127" cy="77.5" r="7.2" />
    <circle cx="114.5" cy="120" r="7.2" />
    <circle cx="70" cy="127" r="7.2" />
    <circle cx="42" cy="113" r="7.2" />
    <circle cx="24" cy="95" r="7.2" />
  </g>
</svg>
